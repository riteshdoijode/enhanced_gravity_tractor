[project]
name = "bennu-defense"
version = "0.1.0"
description = "Interactive Bennu planetary-defense mission simulator: DART-style kinetic impactor + enhanced gravity tractor"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.13",
    "matplotlib>=3.8",
    "h5py>=3.11",
    "pyvista>=0.44",
    "pyvistaqt>=0.11",
    "PySide6>=6.7",
    "pyqtgraph>=0.13",
    "imageio>=2.34",
    "imageio-ffmpeg>=0.5",
    "trimesh>=4.4",
    "requests>=2.32",
    "astropy>=6.1",
    "joblib>=1.4",
    "tqdm>=4.66",
    "pytest>=8.2",
    "mujoco>=3.2",
    "cvxpy>=1.5",
    "numba>=0.68.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-n 6 --dist loadfile"  # 6 worker processes (performance cores); -n 0 for a serial run
filterwarnings = ["ignore::erfa.ErfaWarning"]  # future UTC dates: leap seconds unknown (display only)

[dependency-groups]
dev = [
    "pytest-xdist>=3.8.0",
]
